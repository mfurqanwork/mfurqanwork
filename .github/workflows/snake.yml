name: Contribution snake

# Draws the contribution graph as a snake in Pengopal's opal colours and publishes it to the
# `output` branch, which the profile README shows.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#5f6bff&color_dots=#ebedf0,#c9d3f5,#8fa8ff,#5f6bff,#2a3d78
            dist/snake-dark.svg?palette=github-dark&color_snake=#6fe0f2&color_dots=#161b22,#1c3a6b,#2b77c0,#8fa8ff,#d3a6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update the contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
